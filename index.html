<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#020713">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="SKY RUSH">
<link rel="manifest" href="manifest.json">
<title>SKY RUSH V1.1</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#02050d;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:white}
body{display:flex;align-items:center;justify-content:center}
#gameWrap{position:relative;width:min(100vw,430px);height:100dvh;max-height:900px;overflow:hidden;background:#020713}
canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none}
.screen{position:absolute;inset:0;z-index:10;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;background:linear-gradient(180deg,rgba(3,15,35,.94),rgba(1,4,12,.97))}
.screen h1{margin:0;font-size:44px;letter-spacing:6px;text-shadow:0 0 20px rgba(80,210,255,.5)}
.tag{margin-top:8px;font-size:13px;letter-spacing:2px;opacity:.6}
.credit{margin-top:38px;margin-bottom:24px;font-size:13px;letter-spacing:1px;opacity:.55}
button{appearance:none;-webkit-appearance:none;border:0;outline:0;min-width:190px;padding:16px 35px;border-radius:16px;background:#fff;color:#07111f;font-size:20px;font-weight:800;box-shadow:0 8px 30px rgba(0,0,0,.35);cursor:pointer;touch-action:manipulation}
button:active{transform:scale(.96)}
.hint{margin-top:18px;font-size:12px;opacity:.5}
#hud{position:absolute;z-index:5;top:calc(env(safe-area-inset-top) + 12px);left:14px;right:14px;display:none;justify-content:space-between;font-size:13px;font-weight:800;pointer-events:none;text-shadow:0 1px 4px #000}
#gameOver{display:none}
.final{margin:22px 0 30px;font-size:15px;opacity:.75;line-height:1.8}
</style>
</head>
<body>
<div id="gameWrap">
<canvas id="gameCanvas"></canvas>

<div id="hud">
  <span id="scoreText">SCORE 0</span>
  <span id="coinText">COIN 0</span>
  <span id="hpText">♥♥♥</span>
</div>

<div id="startScreen" class="screen">
  <h1>SKY RUSH</h1>
  <div class="tag">OFFLINE ARCADE • V1.1</div>
  <div class="credit">Made by JohnK &amp; J.Jr.</div>
  <button id="startButton" type="button">START</button>
  <div class="hint">화면을 좌우로 드래그해서 전투기를 움직이세요</div>
</div>

<div id="gameOver" class="screen">
  <h1>GAME OVER</h1>
  <div id="finalText" class="final"></div>
  <button id="retryButton" type="button">RETRY</button>
</div>
</div>

<script>
(() => {
"use strict";

const wrap = document.getElementById("gameWrap");
const canvas = document.getElementById("gameCanvas");
const ctx = canvas.getContext("2d");

const startScreen = document.getElementById("startScreen");
const gameOver = document.getElementById("gameOver");
const startButton = document.getElementById("startButton");
const retryButton = document.getElementById("retryButton");

const scoreText = document.getElementById("scoreText");
const coinText = document.getElementById("coinText");
const hpText = document.getElementById("hpText");
const finalText = document.getElementById("finalText");
const hud = document.getElementById("hud");

let W=0,H=0,dpr=1;
let running=false, animationId=0, lastTime=0;
let score=0, coins=0, hp=3;
let spawnTimer=0, fireTimer=0;
let enemies=[], bullets=[], particles=[], stars=[];
let pointerActive=false;

const player={x:0,y:0,w:34,h:48,speed:460};

function resize(){
  dpr=Math.min(window.devicePixelRatio||1,2);
  W=wrap.clientWidth; H=wrap.clientHeight;
  canvas.width=Math.floor(W*dpr);
  canvas.height=Math.floor(H*dpr);
  canvas.style.width=W+"px"; canvas.style.height=H+"px";
  ctx.setTransform(dpr,0,0,dpr,0,0);
  player.y=H-90;
  if(!player.x) player.x=W/2;
  if(stars.length===0){
    for(let i=0;i<85;i++){
      stars.push({x:Math.random()*W,y:Math.random()*H,s:25+Math.random()*95,a:.2+Math.random()*.5});
    }
  }
}
window.addEventListener("resize",resize);
resize();

function reset(){
  score=0; coins=0; hp=3;
  enemies=[]; bullets=[]; particles=[];
  spawnTimer=.2; fireTimer=0;
  player.x=W/2; player.y=H-90;
  updateHud();
}

function updateHud(){
  scoreText.textContent="SCORE "+score;
  coinText.textContent="COIN "+coins;
  hpText.textContent="♥".repeat(hp)+"♡".repeat(3-hp);
}

function startGame(e){
  if(e){e.preventDefault();e.stopPropagation();}
  reset();
  startScreen.style.display="none";
  gameOver.style.display="none";
  hud.style.display="flex";
  running=true;
  lastTime=performance.now();
  cancelAnimationFrame(animationId);
  animationId=requestAnimationFrame(loop);
}

function endGame(){
  running=false;
  hud.style.display="none";
  finalText.textContent="SCORE "+score+"   •   COIN "+coins;
  gameOver.style.display="flex";
}

startButton.addEventListener("click",startGame);
startButton.addEventListener("touchend",startGame,{passive:false});
retryButton.addEventListener("click",startGame);
retryButton.addEventListener("touchend",startGame,{passive:false});

function setPlayerX(clientX){
  const r=canvas.getBoundingClientRect();
  player.x=Math.max(20,Math.min(W-20,clientX-r.left));
}

canvas.addEventListener("pointerdown",e=>{
  if(!running)return;
  pointerActive=true;
  setPlayerX(e.clientX);
  canvas.setPointerCapture?.(e.pointerId);
});
canvas.addEventListener("pointermove",e=>{
  if(running && pointerActive)setPlayerX(e.clientX);
});
canvas.addEventListener("pointerup",()=>pointerActive=false);
canvas.addEventListener("pointercancel",()=>pointerActive=false);

function shoot(){
  bullets.push({x:player.x,y:player.y-25,r:4,vy:-650});
}

function spawnEnemy(){
  const size=26+Math.random()*15;
  enemies.push({
    x:size/2+Math.random()*(W-size),
    y:-size,
    w:size,h:size,
    vy:80+Math.random()*90
  });
}

function addExplosion(x,y){
  for(let i=0;i<10;i++){
    const a=Math.random()*Math.PI*2, v=50+Math.random()*150;
    particles.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,life:.35+Math.random()*.3});
  }
}

function circleRectHit(cx,cy,r,rx,ry,rw,rh){
  const dx=Math.max(Math.abs(cx-rx)-rw/2,0);
  const dy=Math.max(Math.abs(cy-ry)-rh/2,0);
  return dx*dx+dy*dy<r*r;
}

function loop(now){
  if(!running)return;
  const dt=Math.min((now-lastTime)/1000,.035);
  lastTime=now;

  ctx.clearRect(0,0,W,H);

  // background
  ctx.fillStyle="#020713";
  ctx.fillRect(0,0,W,H);
  for(const s of stars){
    s.y+=s.s*dt;
    if(s.y>H)s.y=-3;
    ctx.globalAlpha=s.a;
    ctx.fillStyle="#dceeff";
    ctx.fillRect(s.x,s.y,1.2,2.4);
  }
  ctx.globalAlpha=1;

  fireTimer-=dt;
  if(fireTimer<=0){shoot();fireTimer=.32;}

  spawnTimer-=dt;
  if(spawnTimer<=0){
    spawnEnemy();
    spawnTimer=Math.max(.35,1.0-score/6000);
  }

  for(const b of bullets)b.y+=b.vy*dt;
  bullets=bullets.filter(b=>b.y>-30);

  for(const e of enemies)e.y+=e.vy*dt;

  for(let i=enemies.length-1;i>=0;i--){
    const e=enemies[i];
    let destroyed=false;

    for(let j=bullets.length-1;j>=0;j--){
      const b=bullets[j];
      if(circleRectHit(b.x,b.y,b.r,e.x,e.y,e.w,e.h)){
        bullets.splice(j,1);
        score+=10; coins+=1;
        addExplosion(e.x,e.y);
        enemies.splice(i,1);
        destroyed=true;
        break;
      }
    }
    if(destroyed)continue;

    if(Math.abs(e.x-player.x)<e.w/2+15 &&
       Math.abs(e.y-player.y)<e.h/2+20){
      enemies.splice(i,1);
      hp--;
      updateHud();
      if(hp<=0){endGame();return;}
    }else if(e.y>H+50){
      enemies.splice(i,1);
    }
  }

  for(let i=particles.length-1;i>=0;i--){
    const p=particles[i];
    p.x+=p.vx*dt;p.y+=p.vy*dt;p.life-=dt;
    if(p.life<=0)particles.splice(i,1);
  }

  // bullets
  ctx.fillStyle="#ffe45c";
  for(const b of bullets){
    ctx.beginPath();ctx.arc(b.x,b.y,b.r,0,Math.PI*2);ctx.fill();
  }

  // enemies
  for(const e of enemies){
    ctx.fillStyle="#ff5368";
    ctx.beginPath();
    ctx.moveTo(e.x,e.y+e.h/2);
    ctx.lineTo(e.x-e.w/2,e.y-e.h/2);
    ctx.lineTo(e.x,e.y-e.h/5);
    ctx.lineTo(e.x+e.w/2,e.y-e.h/2);
    ctx.closePath();ctx.fill();
  }

  // particles
  for(const p of particles){
    ctx.globalAlpha=Math.max(0,p.life/.6);
    ctx.fillStyle="#ffcf4a";
    ctx.fillRect(p.x-2,p.y-2,4,4);
  }
  ctx.globalAlpha=1;

  // player
  ctx.save();
  ctx.translate(player.x,player.y);
  ctx.fillStyle="#53d8ff";
  ctx.beginPath();
  ctx.moveTo(0,-26);ctx.lineTo(14,18);ctx.lineTo(5,13);
  ctx.lineTo(0,23);ctx.lineTo(-5,13);ctx.lineTo(-14,18);ctx.closePath();ctx.fill();
  ctx.fillStyle="#eefcff";
  ctx.beginPath();ctx.ellipse(0,-8,5,9,0,0,Math.PI*2);ctx.fill();
  ctx.restore();

  updateHud();
  animationId=requestAnimationFrame(loop);
}
})();
</script>
<script>if("serviceWorker" in navigator){navigator.serviceWorker.register("sw.js").catch(()=>{});}</script>
</body>
</html>
