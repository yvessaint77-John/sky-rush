function addObj(type,x,y,vy,curve=0){const c=rc();const isEnemy=type==='tank'||type==='scout'||type==='mjplane';let hpv=type==='tank'?c.tankHp:type==='scout'?c.enemyHp:type==='mjplane'?c.mjHp:1;objects.push({type,x,y,baseX:x,vy,phase:Math.random()*6.28,curve,spin:Math.random()*6.28,hp:hpv,maxHp:hpv,w:type==='tank'?42:type==='mjplane'?56:30,h:type==='tank'?42:type==='mjplane'?56:30,isEnemy})}

function segmentRectHit(o,x1,y1,x2,y2,r){
  const hw=(o.type==='mjplane'?38:o.w*.5)+r, hh=(o.type==='mjplane'?38:o.h*.5)+r;
  const minX=o.x-hw,maxX=o.x+hw,minY=o.y-hh,maxY=o.y+hh;
  const dx=x2-x1,dy=y2-y1;
  let t0=0,t1=1;

}
function segmentHit(o,x1,y1,x2,y2,r){
  if(o.type==='mjplane') return segmentRectHit(o,x1,y1,x2,y2,r);

function drawBg(dt){ctx.fillStyle='#01030a';ctx.fillRect(0,0,W,H);const g=ctx.createRadialGradient(W*.5,H*.35,10,W*.5,H*.45,Math.max(W,H)*.85);g.addColorStop(0,'#08152d');g.addColorStop(.45,'#030817');g.addColorStop(1,'#000106');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);for(const s of stars){s.y+=(35+150*s.z)*dt*(laser>0?1.15:1);if(s.y>H)s.y=-5;ctx.globalAlpha=.18+.62*s.z;ctx.fillStyle='#d9f5ff';ctx.fillRect(s.x,s.y,1,1+4*s.z)}ctx.globalAlpha=1;const px=W*.18,py=H*.22,pr=Math.min(W,H)*.105;const pg=ctx.createRadialGradient(px-pr*.35,py-pr*.45,2,px,py,pr);pg.addColorStop(0,'#8aa6d8');pg.addColorStop(.55,'#334b78');pg.addColorStop(1,'#0b1225');ctx.globalAlpha=.72;ctx.fillStyle=pg;ctx.beginPath();ctx.arc(px,py,pr,0,Math.PI*2);ctx.fill();ctx.strokeStyle='#607aa7';ctx.lineWidth=2;ctx.beginPath();ctx.ellipse(px,py,pr*1.35,pr*.32,-.25,0,Math.PI*2);ctx.stroke();const sx=W*.78,sy=H*.30;ctx.strokeStyle='#65738d';ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(sx-18,sy);ctx.lineTo(sx+18,sy);ctx.moveTo(sx,sy-10);ctx.lineTo(sx,sy+10);ctx.stroke();ctx.fillStyle='#8fa4c5';ctx.fillRect(sx-5,sy-4,10,8);ctx.globalAlpha=.45;ctx.fillStyle='#7187a9';ctx.beginPath();ctx.arc(W*.78,H*.72,Math.min(W,H)*.055,0,Math.PI*2);ctx.fill();ctx.globalAlpha=1}

function loop(now){
  if(!running||paused)return;
  const dt=Math.min(.035,(now-last)/1000);
  last=now;
  updateRoundBanner();
  drawBg(dt);
  if(roundTransition>0){
    roundTransition-=dt;
    updateHud();
    raf=requestAnimationFrame(loop);
    return;
  }
  elapsed+=dt;
  level=Math.min(9,round);
  if(elapsed>=30){nextRound();raf=requestAnimationFrame(loop);return;}

 for(const o of objects){o.y+=o.vy*dt;o.x=o.baseX+Math.sin(elapsed*2.3+o.phase)*o.curve;if(o.type==='mjplane')o.x+=Math.sin(elapsed*.55+o.phase)*1.2*dt}objects=objects.filter(o=>o.y<H+60);
 for(const s of shots){s.px=s.x;s.py=s.y;s.y+=s.vy*dt}shots=shots.filter(s=>s.y>-50);for(const s of enemyShots){s.x+=s.vx*dt;s.y+=s.vy*dt;s.life-=dt}enemyShots=enemyShots.filter(s=>s.life>0&&s.y<H+50&&s.x>-50&&s.x<W+50);
 for(let i=objects.length-1;i>=0;i--){const o=objects[i];let hit=false;for(let j=shots.length-1;j>=0;j--){if(o.type==='bichon')continue;if(segmentHit(o,shots[j].px??shots[j].x,shots[j].py??shots[j].y,shots[j].x,shots[j].y,shots[j].r)){shots.splice(j,1);if(['coin','goldpoop','gem','trump','poop','rainbowpoop'].includes(o.type)){objects.splice(i,1);if(o.type==='coin'){coins++;score+=10}else if(o.type==='goldpoop'){coins+=3;score+=50}else if(o.type==='gem'){coins+=2;score+=30;laser=8}else if(o.type==='trump')score+=25;else score+=15;burst(o.x,o.y,14);hit=true}else{o.hp--;if(o.type==='mjplane'){flash=.11;shake=3;burst(o.x,o.y,16,.38);o.hitFx=.16}else burst(o.x,o.y,6);if(o.hp<=0){objects.splice(i,1);score+=o.type==='mjplane'?120:40;coins+=o.type==='mjplane'?5:1;burst(o.x,o.y,28,.8);hit=true}}break}}if(hit)continue;if(collide(o,player.x,player.y,18)&&!['coin','goldpoop','bichon','gem'].includes(o.type)){objects.splice(i,1);hp--;score=Math.max(0,score-10);burst(player.x,player.y,25,.7);flash=.1;shake=6;if(hp<=0){end();return}}else if(collide(o,player.x,player.y,18)&&['coin','goldpoop','bichon','gem'].includes(o.type)){objects.splice(i,1);if(o.type==='coin'){coins++;score+=10}else if(o.type==='goldpoop'){coins+=3;score+=50}else if(o.type==='gem'){coins+=2;score+=30;laser=8}else{rapid=10;score+=40;laserText.textContent='솜솜이 RAPID FIRE'}burst(o.x,o.y,18)}}
 for(let i=enemyShots.length-1;i>=0;i--){const s=enemyShots[i];if(Math.hypot(s.x-player.x,s.y-player.y)<20){enemyShots.splice(i,1);hp--;burst(player.x,player.y,20);if(hp<=0){end();return}}}
 if(laser>0)laser-=dt;if(rapid>0)rapid-=dt;if(flash>0)flash-=dt;if(shake>0)shake-=30*dt;for(let i=particles.length-1;i>=0;i--){const p=particles[i];p.x+=p.vx*dt;p.y+=p.vy*dt;p.vx*=.985;p.vy*=.985;p.life-=dt;if(p.life<=0)particles.splice(i,1)}
 const ms=[5,10,20,30,40,50];for(const m of ms)if(coins>=m)showMilestone(m);updateHud();ctx.save();if(shake>0)ctx.translate((Math.random()-.5)*shake,(Math.random()-.5)*shake);
 for(const s of shots){ctx.shadowBlur=10;ctx.shadowColor=laser>0?'#ff3558':'#ffe36b';ctx.fillStyle=laser>0?'#ffecf1':'#fff2a1';if(s.laser){ctx.fillRect(s.x-5,s.y-24,10,28);ctx.globalAlpha=.35;ctx.fillRect(s.x-10,s.y-40,20,44);ctx.globalAlpha=1}else ctx.fillRect(s.x-2,s.y-12,4,14)}for(const s of enemyShots){ctx.shadowBlur=10;ctx.shadowColor='#ff4e75';ctx.fillStyle='#ff5d83';heart(s.x,s.y,5,'#ff5d83')}ctx.shadowBlur=0;for(const o of objects){if(!o.isEnemy)drawObj(o)}for(const o of objects){if(o.isEnemy){drawObj(o);if(o.type==='mjplane'&&o.hitFx>0){ctx.save();ctx.globalAlpha=Math.min(1,o.hitFx/.16);ctx.strokeStyle='#fff';ctx.lineWidth=3;ctx.shadowBlur=16;ctx.shadowColor='#ff496c';ctx.beginPath();ctx.arc(o.x,o.y,39,0,Math.PI*2);ctx.stroke();ctx.restore();o.hitFx-=dt}}}for(const p of particles){ctx.globalAlpha=Math.max(0,p.life);ctx.fillStyle='#ffd35d';ctx.fillRect(p.x,p.y,p.size,p.size)}ctx.globalAlpha=1;drawPlayer();ctx.restore();if(flash>0){ctx.fillStyle='rgba(255,255,255,.18)';ctx.fillRect(0,0,W,H)}raf=requestAnimationFrame(loop)}
})();
